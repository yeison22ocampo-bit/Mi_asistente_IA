<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Valentina · Asesora de maquillaje</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
  <!-- Aplica el tema guardado antes de pintar, para evitar un parpadeo -->
  <script>
    (function () {
      var raiz = document.documentElement, tema = null, acento = null;
      try { tema = localStorage.getItem('tema_interfaz'); acento = localStorage.getItem('acento_interfaz'); } catch (e) {}
      raiz.dataset.tema = tema || (matchMedia('(prefers-color-scheme: light)').matches ? 'claro' : 'oscuro');
      raiz.dataset.acento = acento || 'peonia';
    })();
  </script>
</head>
<body>
  <div class="fondo-decor" aria-hidden="true"><span></span><span></span></div>

  <div class="app menu-oculto" id="app">

    <!-- Barra lateral: configuración de la clave de Alibaba Cloud (Model Studio) -->
    <aside class="sidebar" id="sidebar" aria-label="Configuración">
      <h2>Configuración</h2>

      <form id="form-clave" class="clave-form" autocomplete="off">
        <label for="input-clave">Clave de Alibaba Cloud (Model Studio)</label>
        <input type="password" id="input-clave" placeholder="Pega tu clave API (sk-...) aquí" autocomplete="off">
        <div class="clave-botones">
          <button type="submit" class="btn-primario">Guardar</button>
          <button type="button" id="btn-borrar-clave" class="btn-secundario">Borrar clave</button>
        </div>
      </form>

      <p id="aviso-clave" class="aviso" role="status"></p>

      <section class="apariencia" aria-labelledby="titulo-tema">
        <h3 id="titulo-tema">Tema</h3>
        <div class="opciones-tema" role="radiogroup" aria-labelledby="titulo-tema">
          <button type="button" class="opcion-tema" role="radio" aria-checked="false" data-tema="oscuro">Oscuro</button>
          <button type="button" class="opcion-tema" role="radio" aria-checked="false" data-tema="claro">Claro</button>
          <button type="button" class="opcion-tema" role="radio" aria-checked="false" data-tema="nude">Nude</button>
        </div>
      </section>

      <section class="apariencia" aria-labelledby="titulo-acento">
        <h3 id="titulo-acento">Color de labial</h3>
        <div class="muestras" role="radiogroup" aria-labelledby="titulo-acento">
          <button type="button" class="muestra" role="radio" aria-checked="false" data-acento="peonia" aria-label="Peonía" title="Peonía"></button>
          <button type="button" class="muestra" role="radio" aria-checked="false" data-acento="vino" aria-label="Vino" title="Vino"></button>
          <button type="button" class="muestra" role="radio" aria-checked="false" data-acento="malva" aria-label="Malva" title="Malva"></button>
          <button type="button" class="muestra" role="radio" aria-checked="false" data-acento="cobre" aria-label="Cobre" title="Cobre"></button>
        </div>
      </section>
    </aside>

    <div class="contenido">

      <!-- Barra superior: logo y botones -->
      <header class="topbar">
        <div class="logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="28" height="28">
            <path fill="currentColor" d="M12 2c-1.7 2.8-6 4.6-6 9a6 6 0 0 0 12 0c0-4.4-4.3-6.2-6-9z"/>
          </svg>
        </div>
        <button id="btn-sidebar" class="btn-icono" aria-label="Mostrar u ocultar barra lateral" aria-controls="sidebar" aria-expanded="false">☰</button>
        <button id="btn-nuevo" class="btn-icono" aria-label="Nuevo chat">+</button>
        <button id="btn-tema" class="btn-icono btn-tema" role="switch" aria-checked="true" aria-label="Modo oscuro" title="Cambiar entre modo claro y oscuro">
          <svg class="icono-sol" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="2"/><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.5 1.5M17.2 17.2l1.5 1.5M5.3 18.7l1.5-1.5M17.2 6.8l1.5-1.5"/></svg>
          <svg class="icono-luna" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>
        </button>
      </header>

      <!-- Zona de conversación -->
      <main class="chat" id="chat">
        <section class="bienvenida" id="bienvenida">
          <div class="hero-labial" aria-hidden="true">
            <svg class="labial" viewBox="0 0 100 150">
              <g class="labial-barra">
                <path class="l-barra" d="M38 82V44l24-14v52z"/>
                <path class="l-brillo" d="M42 82V47l4-2.4V82z"/>
              </g>
              <rect class="l-oro" x="34" y="78" width="32" height="14" rx="2"/>
              <rect class="l-tubo" x="30" y="92" width="40" height="52" rx="5"/>
              <rect class="l-oro" x="30" y="92" width="40" height="8"/>
              <rect class="l-brillo" x="35" y="106" width="4" height="34" rx="2"/>
            </svg>
          </div>
          <h1>¡Hola! ¿De qué quieres hablar hoy?</h1>
          <div class="sugerencias">
            <button type="button" class="sugerencia" data-texto="Tengo piel grasa, ¿qué base me conviene?">Tengo piel grasa, ¿qué base me conviene?</button>
            <button type="button" class="sugerencia" data-texto="Quiero un look natural para el día">Quiero un look natural para el día</button>
            <button type="button" class="sugerencia" data-texto="Busco un labial para una boda">Busco un labial para una boda</button>
            <button type="button" class="sugerencia" data-texto="¿Cómo elijo el tono de mi corrector?">¿Cómo elijo el tono de mi corrector?</button>
          </div>
        </section>
        <div class="mensajes" id="mensajes"></div>
      </main>

      <!-- Cuadro de entrada -->
      <footer class="pie">
        <form id="form-chat" class="entrada">
          <label for="mensaje" class="sr-only">Escribe tu mensaje</label>
          <textarea id="mensaje" rows="1" placeholder="Mensaje al asistente de maquillaje"></textarea>

          <div class="entrada-barra">
            <div class="chips">
              <!-- "Pensamiento Profundo" activa el modelo de razonamiento; "Búsqueda inteligente" es decorativa -->
              <button type="button" id="btn-pensamiento" class="chip" aria-pressed="false" title="Modo razonamiento profundo: respuestas más elaboradas, pero tarda más en empezar">Pensamiento Profundo</button>
              <span class="chip chip-acento">Búsqueda inteligente</span>
            </div>

            <div class="entrada-acciones">
              <button type="button" class="btn-icono" aria-label="Adjuntar archivo (no disponible)">
                <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                  <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M21 11.5l-8.5 8.5a5 5 0 0 1-7-7L14 4.5a3.5 3.5 0 0 1 5 5L10.5 18a2 2 0 0 1-3-3L16 6.5"/>
                </svg>
              </button>
              <button type="submit" id="btn-enviar" class="btn-enviar" aria-label="Enviar mensaje">
                <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                  <path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M12 19V5M5 12l7-7 7 7"/>
                </svg>
              </button>
            </div>
          </div>
        </form>
      </footer>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
